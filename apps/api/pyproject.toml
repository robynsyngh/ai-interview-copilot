[project]
name = "copilot-api"
version = "0.1.0"
description = "AI Interview Co-Pilot - FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "deepgram-sdk>=3.7.7,<4.0.0",
    "structlog>=24.4.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# N = pep8-naming: enforce snake_case functions/variables, PascalCase classes, etc.
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "N"]
# S101: allow asserts. B008: FastAPI's Depends()/Query() in defaults is idiomatic.
# E501: long lines are fine here (prompt/question string literals are kept on one line).
ignore = ["S101", "B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
