<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>README preview · AI Interview Co-Pilot</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    .wrap { max-width: 1012px; margin: 0 auto; padding: 32px 24px 96px; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px 40px 48px;
    }
    h1, h2, h3 { line-height: 1.25; }
    h1 { font-size: 2rem; }
    h2 { border-bottom: 1px solid #30363d; padding-bottom: .3em; margin-top: 2em; }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { background: #6e768166; padding: .2em .4em; border-radius: 6px; font-size: 85%; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 16px; overflow: auto; }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; width: 100%; margin: 1em 0; display: block; overflow-x: auto; }
    th, td { border: 1px solid #30363d; padding: 8px 13px; }
    th { background: #161b22; }
    tr:nth-child(2n) { background: #161b2255; }
    img { max-width: 100%; }
    blockquote { border-left: 4px solid #f59e0b; margin: 1em 0; padding: .4em 1em; background: #f59e0b14; color: #c9d1d9; }
    .mermaid { background: #ffffff; border-radius: 8px; padding: 16px; margin: 1em 0; text-align: center; }
    .banner { position: sticky; top: 0; background: #1f6feb; color: #fff; padding: 8px 16px; font-size: 13px; z-index: 5; }
    summary { cursor: pointer; font-weight: 600; }
    hr { border: none; border-top: 1px solid #30363d; margin: 2em 0; }
  </style>
</head>
<body>
  <div class="banner">📄 Local README preview — auto-renders Markdown + Mermaid. Edit <code>README.md</code> and refresh to update.</div>
  <div class="wrap"><div class="card" id="content">Loading README.md…</div></div>
  <script>
    mermaid.initialize({ startOnLoad: false, theme: "default" });
    fetch("./README.md?" + Date.now())
      .then(r => r.text())
      .then(md => {
        marked.setOptions({ gfm: true, breaks: false });
        document.getElementById("content").innerHTML = marked.parse(md);
        // Convert ```mermaid code blocks into <div class="mermaid"> for rendering.
        document.querySelectorAll('code.language-mermaid').forEach(code => {
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = code.textContent;
          code.closest('pre').replaceWith(div);
        });
        mermaid.run();
      })
      .catch(e => {
        document.getElementById("content").textContent = "Failed to load README.md: " + e;
      });
  </script>
</body>
</html>
